name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ "1.21.11", "26.2" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.target }}
        run: ./gradlew ":${{ matrix.target }}:build" --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chesttracker-${{ matrix.target }}
          path: versions/${{ matrix.target }}/build/libs/*.jar

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: versions/${{ matrix.target }}/build/test-results/
